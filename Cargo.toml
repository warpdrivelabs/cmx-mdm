# cmx-mdm —— 独立主数据（MDM）微服务 workspace（从 cmx-container 抽出，对标 cmx-model / cmx-report）。
#
# 承载主数据治理能力中心：激活映射 / 变更请求(CR)审批 / 查重去重 / 合并 golden record /
# 订阅分发(webhook/kafka/rocketmq) / 审计事件 / 流程平台对接。
#
# 「一芯多壳」（对标 cmx-model）：
# - **中立核** cmx-mdm-app（新建）：全部 axum handler（合并原 cmx-mdm-api）+ 泛型路由表
#   mdm_routes::<S>() + 分发引擎 + 流程客户端 + 监控大盘 + 前端联邦。信封直用 cmx-api-types，
#   不依赖 cmx-api-core（不认 CmxAppState）。
# - **独立壳** cmx-mdm-server（本 workspace）：chassis bin :8095，单 DB 栈（tokio-pg）。
# - **平台壳** cmx-mdm-proxy（留 cmx-container，M5 新建）：proxy-only 反代到独立壳，前端零改。
# - 域内库 cmx-mdm-{model,store-pg}（从 container 物理迁入）。
#
# ★ 跨 workspace 依赖（本库须与 ../cmx-container 并排存在）：
# - 基础设施 + DCT 数据服务 + 编码引擎（cmx-core/cmx-database-pg/cmx-dct-store-pg/cmx-code-api/…）
#   → 跨 ws path 进 ../cmx-container。（DCT 激活复用 dict_meta/dict_save_apply，查重读 DictMeta；
#   DCT 不反依赖 MDM，无环。）
[workspace]
resolver = "2"
members = [
    "crates/cmx-mdm-model",
    "crates/cmx-mdm-store-pg",
    "crates/cmx-mdm-app",
    "crates/cmx-mdm-server",
]

[workspace.package]
version = "0.1.12"
edition = "2024"
authors = ["skylake@pansoft.com"]

[workspace.dependencies]
# —— 域内 MDM crate（纯 path）——
cmx-mdm-model = { path = "crates/cmx-mdm-model", version = "0.1.12" }
cmx-mdm-store-pg = { path = "crates/cmx-mdm-store-pg", version = "0.1.12" }
cmx-mdm-app = { path = "crates/cmx-mdm-app", version = "0.1.12" }

# —— 跨 ws 进 cmx-container（DCT 数据服务 + 编码引擎，激活/查重/铸号复用）——
# 数据运行态 crate 已随第二批阶段三回沉 cmx-container（真源在平台仓集中治理）：
# cmx-dct-store-pg / cmx-code-api / cmx-model-meta 等全链单源，不再有跨服务仓 path 依赖。
cmx-dct-store-pg = { path = "../cmx-container/crates/libs/cmx-dct/cmx-dct-store-pg", version = "0.1.12" }
# 编码引擎（CodeEngine 实现 cmx-traits CodeMinter；cmx_code_rule/seq/gap 三表在业务库）——
# MDM 激活器进程内铸号（dictMeta.codeRule → mint_dict_code → GlobalCodeMinter）依赖此注入，
# 与 cmx-model-server 的自注入同源（独立微服务各自注入，见 cmx-mdm-server main.rs）。
cmx-code-api = { path = "../cmx-container/crates/libs/cmx-code/cmx-code-api", version = "0.1.12" }


# —— 跨 ws 进 cmx-container 基础设施 ——
cmx-core = { path = "../cmx-container/crates/libs/cmx-core", version = "0.1.12" }
cmx-utils = { path = "../cmx-container/crates/libs/cmx-utils", version = "0.1.12" }
cmx-biz = { path = "../cmx-container/crates/libs/cmx-biz", version = "0.1.12" }
cmx-traits = { path = "../cmx-container/crates/libs/cmx-traits", version = "0.1.12" }
cmx-api-types = { path = "../cmx-container/crates/libs/cmx-apis/cmx-api-types", version = "0.1.12" }
# 页面只读投递（native/html-pages 六端点通用路由，收编原 native_pages.rs）
cmx-form = { path = "../cmx-container/crates/libs/cmx-form", version = "0.1.12" }
# 引擎应用层横切件单源（tenant 上下文 / dbid 路由 / 两族 auth 中间件 / resp 别名——收编本仓 db_id.rs 等同源副本）
cmx-engine-kit = { path = "../cmx-container/crates/libs/cmx-engine-kit", version = "0.1.12" }
cmx-database-pg = { path = "../cmx-container/crates/libs/cmx-infra/cmx-database-pg", version = "0.1.12" }
cmx-web-chassis = { path = "../cmx-container/crates/libs/cmx-web-chassis", version = "0.1.12" }
cmx-web-monitor = { path = "../cmx-container/crates/libs/cmx-web-monitor", version = "0.1.12" }
cmx-service-base = { path = "../cmx-container/crates/libs/cmx-service-base", version = "0.1.12", default-features = false }
# 服务间统一调用基座 + 契约 SDK（flow 调用 / webhook 回调契约）
cmx-service-rpc = { path = "../cmx-container/crates/libs/cmx-infra/cmx-service-rpc", version = "0.1.12" }
cmx-flow-sdk = { path = "../cmx-container/crates/libs/cmx-flow/cmx-flow-sdk", version = "0.1.12" }
cmx-mdm-sdk = { path = "../cmx-container/crates/libs/cmx-mdm/cmx-mdm-sdk", version = "0.1.12" }

# —— 外部 crate（版本照抄 cmx-container 根）——
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
async-trait = "0.1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
dashmap = "6"
rand = "0.8"
utoipa = { version = "5", features = ["axum_extras", "chrono", "decimal", "uuid"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# 请求级身份中间件：X-Delegated-User-Token（门户代理转发的用户 JWT）HS256 验签解 sub
jsonwebtoken = "9"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
tokio = { version = "1.41", features = ["full"] }
axum = { version = "0.8.9", features = ["macros", "multipart"] }
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = "thin"

# 测试 profile（继承 dev）：专为 cargo test 裁剪体积
# debug = 1：仅保留行号表（backtrace 仍有行号可定位），测试二进制体积大幅缩小
# incremental = true：保留增量编译，改动后重跑测试更快
[profile.test]
debug = 1
incremental = true
