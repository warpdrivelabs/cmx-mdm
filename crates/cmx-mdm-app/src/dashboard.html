<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MEGA MDM · 主数据中心监控大盘</title>
<style>
  :root{--bg:#0a1512;--panel:#11201b;--panel2:#16281f;--fg:#e6f2ec;--muted:#84a99a;
    --accent:#28d09a;--accent2:#3ba6ff;--ok:#39d98a;--line:#20362c;}
  @media (prefers-color-scheme: light){
    :root{--bg:#f2f9f5;--panel:#fff;--panel2:#e9f5ee;--fg:#0f2019;--muted:#4e6b5e;
      --accent:#12a06a;--accent2:#2b7fff;--ok:#12a05a;--line:#d5e6dc;}
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);}
  header{padding:22px 28px;border-bottom:1px solid var(--line);background:linear-gradient(120deg,rgba(40,208,154,.14),rgba(59,166,255,.12));}
  h1{margin:0;font-size:20px;letter-spacing:.5px}
  h1 .sub{font-weight:400;color:var(--muted);font-size:13px;margin-left:10px}
  .wrap{padding:24px 28px;max-width:1100px;margin:0 auto}
  .status{display:flex;align-items:center;gap:10px;margin-bottom:22px;font-size:14px;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:26px}
  .cap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .cap .k{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
  .cap .l{margin-top:6px;font-size:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .card h2{margin:0;padding:14px 18px;font-size:13px;border-bottom:1px solid var(--line);background:var(--panel2);color:var(--muted);font-weight:600}
  .pages{display:flex;flex-wrap:wrap;gap:8px;padding:16px 18px}
  .tag{padding:3px 11px;border-radius:20px;font-size:12px;background:rgba(40,208,154,.15);color:var(--accent)}
  .foot{color:var(--muted);font-size:12px;margin-top:18px;text-align:center}
</style>
</head>
<body>
<header><h1>◆ MEGA MDM <span class="sub">主数据中心微服务 · cmx-web-chassis · :8095</span></h1></header>
<div class="wrap">
  <div class="status"><span class="dot"></span><span id="st">轮询 /api/mdm/stats…</span></div>
  <div class="grid" id="caps"></div>
  <div class="card">
    <h2>前端页面（native · 经门户联邦投递）</h2>
    <div class="pages" id="pages"></div>
  </div>
  <div class="foot" id="ts"></div>
</div>
<script>
async function tick(){
  try{
    const r = await fetch('/api/mdm/stats',{headers:{accept:'application/json'}});
    const j = await r.json(); const d=(j&&j.data)||j||{};
    document.getElementById('st').textContent = (d.service||'cmx-mdm') + ' · ' + (d.status||'?');
    document.getElementById('caps').innerHTML = (d.capabilities||[]).map(c=>
      `<div class="cap"><div class="k">${c.key}</div><div class="l">${c.label}</div></div>`).join('');
    document.getElementById('pages').innerHTML = (d.pages||[]).map(p=>`<span class="tag">${p}</span>`).join('');
    document.getElementById('ts').textContent = '已更新 ' + new Date().toLocaleTimeString();
  }catch(e){ document.getElementById('st').textContent = '取数失败: ' + e; }
}
tick(); setInterval(tick, 8000);
</script>
</body>
</html>
